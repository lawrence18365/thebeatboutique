<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | The Beat Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--primary-navy);
            color: var(--text-cream);
            position: relative;
            overflow: hidden;
        }
        .error-content {
            position: relative;
            z-index: 2;
        }
        .error-code {
            font-family: var(--font-serif);
            font-size: clamp(6rem, 15vw, 12rem);
            color: var(--accent-gold);
            line-height: 1;
            opacity: 0.2;
            margin-bottom: -2rem;
        }
        .error-title {
            font-size: var(--h2-size);
            margin-bottom: 1.5rem;
        }
        .error-text {
            max-width: 500px;
            margin: 0 auto 2.5rem;
            opacity: 0.8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <nav class="navbar" style="position: absolute; top: 0; background: transparent;">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="assets/images/the_beat_boutique_logo.webp" alt="The Beat Boutique" class="logo-img">
            </a>
        </div>
    </nav>

    <section class="error-section">
        <div class="error-content container">
            <div class="error-code">404</div>
            <h1 class="error-title">Off The Setlist</h1>
            <p class="error-text">Looks like this page skipped a beat. The page you are looking for doesn't exist or has been moved.</p>
            <a href="index.html" class="btn btn-primary">Back to Stage</a>
        </div>
    </section>

</body>
</html>
